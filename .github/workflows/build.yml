
name: Build AutoScribe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi
          pip install pyinstaller

      - name: Build application
        run: >
          pyinstaller --noconfirm --clean --onefile
          --noconsole
          --name AutoScribe
          --add-data "web${{ runner.os == 'Windows' && ';' || ':' }}web"
          main.py

      - name: Copy runtime data
        run: python -c "import shutil; shutil.copy2('locations.json', 'dist/locations.json')"

      - name: Package application
        shell: bash
        run: |
          cd dist
          python -c "import os, platform; print(platform.system())"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../AutoScribe-${{ matrix.platform }}.zip" AutoScribe.exe locations.json
          else
            chmod +x AutoScribe
            zip "../AutoScribe-${{ matrix.platform }}.zip" AutoScribe locations.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AutoScribe-${{ matrix.platform }}
          path: AutoScribe-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Launch test
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Show test failures
        if: failure()
        run: cat app/build/test-results/testReleaseUnitTest/*.xml || true

      - name: Copy APK
        run: cp app/build/outputs/apk/release/app-release.apk ../AutoScribe-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoScribe-android
          path: AutoScribe-android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.apk

name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "locations.json"
      - ".github/workflows/android.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../AutoScribe-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoScribe-android
          path: AutoScribe-android.apk
          if-no-files-found: error
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: AutoScribe-android.apk
